
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: devops-lab
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /stub_status {
            stub_status;
            allow 127.0.0.1;
            allow 10.244.0.0/16;
            deny all;
        }
    }
